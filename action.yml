name: 'Setup PHP for CosmicMC-PMMP'
description: 'Install PHP and Composer for CosmicMC-PMMP and related projects'
author: 'CosmicMC-PMMP'
inputs:
  php-version:
    required: true
    description: 'PHP version to install, e.g. "8.1" - see all available at https://github.com/CosmicMC-PMMP/PHP-Binaries/releases?q=latest'
  install-path:
    required: true
    description: 'Path to install the binary to'
  pm-version-major:
    required: false
    description: 'Major version of CosmicMC-PMMP to install PHP for, e.g. "5"'
    default: 5

runs:
  using: 'node24'
  main: 'dist/index.js'
